[project]
name = "arxiv-tldr"
version = "0.1.0"
description = "A daily digest of newly announced arXiv papers, triaged and summarized by a local LLM."
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "pydantic>=2.7",
    "pymupdf>=2.0",
    "python-dotenv>=1.0",
]

[project.scripts]
arxiv-tldr = "arxiv_tldr.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arxiv_tldr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits real Ollama; needs ARXIV_TLDR_LIVE=1"]
